<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>洋書リーダー</title>
<meta name="description" content="Project Gutenberg の名作を原文で読み、AIで翻訳・語句の意味・あらすじを調べられる読書アプリ">
<meta name="theme-color" content="#2E5E4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="洋書リーダー">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Shippori+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 片手で持つ文庫本のような縦長の1カラム。下にタブ、作品と読書画面は上に重なるシート */
:root {
  --bg: #F1F2EF;          /* 白鼠 */
  --surface: #FFFFFF;
  --ink: #1D2228;
  --muted: #69727C;
  --line: #DCDFE1;
  --accent: #2E5E4E;      /* 緑青 */
  --accent-ink: #FFFFFF;
  --ai: #6A4C8C;          /* 江戸紫 */
  --ai-soft: rgba(106, 76, 140, 0.10);
  --soft: rgba(46, 94, 78, 0.08);
  --danger: #A23A3A;
  --shadow: 0 1px 2px rgba(20, 26, 33, .08), 0 6px 18px rgba(20, 26, 33, .06);
  --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --surface: #1B1E22; --ink: #E4E6E9; --muted: #9AA2AB; --line: #2B3036;
    --accent: #86C2AC; --accent-ink: #0E1A16; --ai: #B79DDB; --ai-soft: rgba(183, 157, 219, 0.13);
    --soft: rgba(134, 194, 172, 0.10); --danger: #E08080;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1B1E22; --ink: #E4E6E9; --muted: #9AA2AB; --line: #2B3036;
  --accent: #86C2AC; --accent-ink: #0E1A16; --ai: #B79DDB; --ai-soft: rgba(183, 157, 219, 0.13);
  --soft: rgba(134, 194, 172, 0.10); --danger: #E08080;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

#app { max-width: 460px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; position: relative; background: var(--bg); }
.topbar { padding: 14px 18px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.topbar h1 { font-family: var(--serif); font-weight: 700; font-size: 26px; margin: 0; letter-spacing: .04em; text-wrap: balance; }
.topbar .sub { color: var(--muted); font-size: 12px; }
#view { flex: 1; overflow-y: auto; padding: 4px 16px 24px; -webkit-overflow-scrolling: touch; }

.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { background: none; border: 0; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.tabs button[aria-current="true"] { color: var(--accent); font-weight: 700; }
.tabs svg { width: 22px; height: 22px; }

h2.sec { font-family: var(--serif); font-size: 19px; font-weight: 700; margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; text-wrap: balance; }
h2.sec:first-child { margin-top: 10px; }
.hint { color: var(--muted); font-size: 12.5px; }
.row { display: flex; gap: 10px; align-items: center; }
.spacer { flex: 1; }

.hscroll { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 8px; margin: 0 -2px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }

/* 装丁 */
.cover { position: relative; flex: none; border-radius: 3px 5px 5px 3px; color: var(--c-fg); background: var(--c-bg); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: row-reverse; justify-content: flex-start; gap: 4px; padding: 12% 10% 0 10%; }
.cover::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 7%; background: rgba(255,255,255,.14); }
.cover::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 9%; height: 1px; background: currentColor; opacity: .35; }
.cover .ct, .cover .ca { writing-mode: vertical-rl; font-family: var(--serif); white-space: nowrap; overflow: hidden; }
.cover .ct { font-weight: 700; letter-spacing: .08em; }
.cover .ca { opacity: .78; letter-spacing: .1em; padding-top: 18%; }

.card-book { width: 92px; text-align: left; background: none; border: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.card-book .t { font-size: 12.5px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-book .a { font-size: 11px; color: var(--muted); }
.bar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }

.list { display: flex; flex-direction: column; }
.item { display: flex; gap: 13px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item .title { font-family: var(--serif); font-weight: 600; font-size: 16.5px; line-height: 1.4; }
.item .meta { color: var(--muted); font-size: 12.5px; }
.item .reason { font-size: 13px; line-height: 1.65; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tag { display: inline-block; font-size: 11px; color: var(--muted); background: var(--soft); border-radius: 4px; padding: 1px 6px; margin-right: 4px; }
.tag.read { color: var(--accent); font-weight: 700; }
.badge-ai { display: inline-flex; align-items: center; gap: 3px; font-family: var(--sans); font-size: 11px; font-weight: 700; color: var(--ai); background: var(--ai-soft); border-radius: 999px; padding: 1px 8px; letter-spacing: .04em; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ai { background: var(--ai); color: var(--surface); border-color: var(--ai); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.panel + .panel { margin-top: 12px; }
.ai-out { font-size: 14.5px; line-height: 1.85; }
.ai-out h4 { font-family: var(--serif); font-size: 16px; margin: 16px 0 4px; }
.ai-out h4:first-child { margin-top: 0; }
.ai-out p { margin: 0 0 8px; }
.ai-out ul { margin: 0 0 8px; padding-left: 1.2em; }
.thinking { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.thinking::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--ai); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

input[type="search"], input[type="text"], textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 90px; resize: vertical; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--soft); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 6px 4px; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); font-weight: 700; }

.grid-shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 20px 14px; margin-top: 14px; }

.empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 13.5px; }
.empty b { display: block; color: var(--ink); font-family: var(--serif); font-size: 17px; margin-bottom: 6px; }

.paste-cover { background: var(--soft); color: var(--accent); border: 1.5px dashed var(--accent); box-shadow: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0; text-align: center; }
.paste-cover::before, .paste-cover::after { display: none; }
.paste-cover span { font-size: 30px; line-height: 1; }
.paste-cover small { font-size: 12px; font-weight: 700; line-height: 1.4; }
.quote { font-family: var(--serif); font-size: 16px; line-height: 1.9; }
.quote::before { content: "「"; } .quote::after { content: "」"; }

/* 作品詳細シート */
.layer { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 10; }
.layer-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px; }
.icon-btn { border: 0; background: none; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; }
.icon-btn:hover { background: var(--soft); }
.icon-btn svg { width: 22px; height: 22px; }
.layer-body { flex: 1; overflow-y: auto; padding: 0 16px 30px; }
.detail-head { display: flex; gap: 16px; align-items: flex-start; }
.detail-head .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.detail-head h3 { font-family: var(--serif); font-size: 22px; margin: 0; line-height: 1.35; text-wrap: balance; }
.stars button { border: 0; background: none; font-size: 20px; color: #C88A2E; padding: 0 1px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }

/* 読書画面 */
#reader { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--r-bg); color: var(--r-fg); }
#reader[data-rtheme="paper"] { --r-bg: #F4EFE4; --r-fg: #2B2A27; --r-rt: #7C705E; --r-bar: rgba(244,239,228,.94); }
#reader[data-rtheme="white"] { --r-bg: #FFFFFF; --r-fg: #1E1E1E; --r-rt: #6B6B6B; --r-bar: rgba(255,255,255,.94); }
#reader[data-rtheme="dark"] { --r-bg: #16181B; --r-fg: #D8D5CE; --r-rt: #96918A; --r-bar: rgba(22,24,27,.94); }
.r-top, .r-bottom { background: var(--r-bar); backdrop-filter: blur(8px); transition: opacity .2s; z-index: 2; }
.r-top { display: flex; align-items: center; gap: 6px; padding: 8px 8px; border-bottom: 1px solid rgba(127,127,127,.18); }
.r-top .ttl { flex: 1; min-width: 0; text-align: center; font-size: 13px; line-height: 1.3; }
.r-top .ttl b { display: block; font-family: var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-bottom { padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid rgba(127,127,127,.18); display: flex; flex-direction: column; gap: 8px; }
#reader.hide-chrome .r-top, #reader.hide-chrome .r-bottom { opacity: 0; pointer-events: none; }
.r-bottom .bar { background: rgba(127,127,127,.25); }
#reader[data-vertical="true"] .r-bottom .bar { transform: scaleX(-1); }
.r-bottom .row { font-size: 13px; }
.r-bottom .btn { background: transparent; color: var(--r-fg); border-color: rgba(127,127,127,.35); }

#page { flex: 1; min-height: 0; overflow: auto; position: relative; font-family: var(--r-font); font-size: var(--r-size); line-height: var(--r-lh); text-align: justify; -webkit-user-select: text; user-select: text; scrollbar-width: thin; }
#reader[data-vertical="true"] #page { writing-mode: vertical-rl; padding: 36px 26px 30px; overflow-y: hidden; }
#reader[data-vertical="false"] #page { padding: 26px 22px 60px; overflow-x: hidden; }
#page .w-head { font-weight: 600; }
#reader[data-vertical="true"] #page .w-head { margin-left: 2.2em; }
#reader[data-vertical="false"] #page .w-head { margin-bottom: 2em; }
#page .w-title { font-size: 1.45em; font-weight: 700; margin: 0; }
#page .w-author { font-size: 1em; font-weight: 400; margin: 0; }
#reader[data-vertical="true"] #page .w-author { padding-top: 5em; }
#page p { margin: 0; }
#page p.blank { min-inline-size: 1em; }
#page p.h { font-weight: 700; font-size: 1.12em; }
#page rt { font-size: .5em; color: var(--r-rt); }
#page em.dot { font-style: normal; -webkit-text-emphasis-style: sesame; text-emphasis-style: sesame; }
#page .tcy { text-combine-upright: all; -webkit-text-combine: horizontal; }
#page hr.pb { border: 0; margin: 0; inline-size: 0; block-size: 0; }
#reader[data-vertical="true"] #page hr.pb { margin-left: 3em; }
#reader[data-vertical="false"] #page hr.pb { margin-top: 3em; }
#page ::selection { background: rgba(106, 76, 140, .28); }
.r-note { font-family: var(--sans); font-size: 12px; color: var(--r-rt); }
#reader[data-vertical="true"] .r-note { margin-left: 2em; }

.selbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 118px; z-index: 5; display: flex; gap: 6px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 6px; box-shadow: var(--shadow); }
.selbar button { border: 0; background: none; color: var(--bg); padding: 7px 12px; border-radius: 8px; font-size: 13.5px; white-space: nowrap; }
.selbar button:hover { background: rgba(127,127,127,.25); }

/* 下から出るシート */
#sheet-wrap { position: absolute; inset: 0; z-index: 40; background: rgba(10, 14, 18, .38); display: flex; align-items: flex-end; }
#sheet { background: var(--surface); color: var(--ink); width: 100%; max-height: 86%; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
#sheet .sh-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 6px 18px; }
#sheet .sh-head h3 { margin: 0; flex: 1; font-family: var(--serif); font-size: 18px; }
#sheet .sh-body { overflow-y: auto; padding: 4px 18px 22px; display: flex; flex-direction: column; gap: 12px; }
.ctx { font-family: var(--serif); font-size: 13px; color: var(--muted); background: var(--soft); border-radius: 8px; padding: 9px 11px; line-height: 1.8; }
.ctx mark { background: var(--ai-soft); color: var(--ink); font-weight: 600; }

#toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 8px 16px; font-size: 13px; box-shadow: var(--shadow); white-space: nowrap; }

@media (min-width: 520px) {
  body { padding-block: 18px; }
  #app { border-radius: 26px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0,0,0,.12); height: calc(100% - 36px); }
}
@media (prefers-reduced-motion: reduce) { .thinking::before { animation: none; } }

/* ---- Webアプリ版の追加 ---- */
[hidden] { display: none !important; }
/* iPhone：入力欄が16px未満だと拡大されて画面がはみ出すので防ぐ／ページ全体は動かさず中だけスクロール */
input, textarea, select { font-size: 16px !important; }
html, body { overflow: hidden; width: 100%; }
#view, .layer-body { overflow-x: hidden; overscroll-behavior: contain; }
.tabs { position: relative; z-index: 15; }
.layer-body { padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overscroll-behavior: none; }
body { margin: 0; -webkit-tap-highlight-color: transparent; }
#app { height: 100dvh; }
.topbar { padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
.layer-head { padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
.r-top { padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
#sheet .sh-body { padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
.banner { margin: 0 16px 6px; padding: 10px 12px; border-radius: 10px; background: var(--soft); font-size: 13px; display: flex; gap: 10px; align-items: center; }
.r-loading { margin: auto; padding: 40px 20px; text-align: center; writing-mode: horizontal-tb; font-family: var(--sans); font-size: 14px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
#reader[data-vertical="true"] #page:has(.r-loading) { writing-mode: horizontal-tb; display: flex; }
#page img.gaiji { inline-size: 1em; block-size: 1em; vertical-align: -0.1em; }
#reader[data-rtheme="dark"] #page img.gaiji { filter: invert(0.85); }
a.item:hover .title { text-decoration: underline; }
@media (min-width: 520px) { #app { height: calc(100dvh - 36px); } }

/* ---- 洋書リーダー：英文向けの調整 ---- */
:root { --serif-en: "Literata", "Iowan Old Style", Georgia, serif; --sans-en: -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; }
.cover { flex-direction: column; justify-content: space-between; padding: 14% 11% 16%; gap: 6px; }
.cover .ct, .cover .ca { writing-mode: horizontal-tb !important; white-space: normal !important; font-family: var(--serif-en); line-height: 1.15; overflow: hidden; display: block; flex: none; max-height: none; position: relative; z-index: 1; overflow-wrap: anywhere; }
.cover .ct { max-height: 5.75em; font-weight: 600; letter-spacing: 0; }
.cover .ca { max-height: 2.3em; padding-top: 0 !important; letter-spacing: 0.02em; font-style: italic; opacity: .8; }
.item .title, .detail-head h3 { font-family: var(--serif-en), var(--serif); }
.tag.lv { color: var(--ai); background: var(--ai-soft); }
.notice { margin-top: 8px; font-size: 13.5px; }
.quote-en { font-family: var(--serif-en); font-size: 16px; line-height: 1.7; }
.quote-ja { font-family: var(--serif); font-size: 14.5px; line-height: 1.8; color: var(--muted); margin-top: 6px; }
#page { writing-mode: horizontal-tb !important; overflow-x: hidden; overflow-y: auto; padding: 22px 20px 80px; text-align: left; hyphens: auto; -webkit-hyphens: auto; }
#page .col { max-width: 36em; margin: 0 auto; }
#page .w-head { margin: 8px 0 2.2em; text-align: center; }
#page .w-title { font-size: 1.5em; line-height: 1.3; font-weight: 700; }
#page .w-author { font-style: italic; margin-top: .4em; }
#page p { margin: 0 0 0.85em; }
#page p.v { white-space: pre-line; padding-left: 1.2em; font-style: normal; }
#page h3 { font-size: 1.15em; text-align: center; margin: 2.2em 0 1em; letter-spacing: 0.04em; }
#page .tr { font-family: var(--serif); font-size: 0.86em; line-height: 1.85; color: var(--r-tr); border-left: 2px solid var(--r-trline); padding: 2px 0 2px 12px; margin: -0.35em 0 1.1em; }
#reader[data-showtr="false"] #page .tr { display: none; }
#page .busy { background: linear-gradient(90deg, transparent, rgba(106,76,140,.12), transparent); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; border-radius: 4px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
#reader[data-rtheme="paper"] { --r-tr: #4F5A52; --r-trline: #9DB8AC; }
#reader[data-rtheme="white"] { --r-tr: #4A4F55; --r-trline: #A9C4B9; }
#reader[data-rtheme="dark"] { --r-tr: #B7BFB9; --r-trline: #4D6B5F; }
#reader[data-showtr="true"] #page [data-i] { cursor: pointer; }
.r-bottom .row { gap: 6px; flex-wrap: wrap; }
.r-bottom .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.toc-item { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 2px; font-family: var(--serif-en); }
.toc-item small { font-family: var(--serif); color: var(--muted); }
.toc-item.past { color: var(--muted); }
.r-note { text-align: center; margin: 3em 0 1em !important; }
@media (prefers-reduced-motion: reduce) { #page .busy { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><h1 id="vtitle">洋書リーダー</h1></div>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>ホーム</button>
    <button data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>さがす</button>
    <button data-tab="shelf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h3v16H5zM10 4h3v16h-3zM15.5 4.5l2.9-.8 3.6 15.4-2.9.7z"/></svg>本棚</button>
    <button data-tab="phrases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5h14v10H10l-4 4v-4H5z"/></svg>ことば</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3.2"/></svg>設定</button>
  </nav>

  <section id="detail" class="layer" hidden></section>

  <section id="reader" hidden data-rtheme="paper" data-showtr="true">
    <div class="r-top">
      <button class="icon-btn" data-act="close-reader" aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="ttl"><b id="r-title"></b><span id="r-author"></span></div>
      <button class="icon-btn" data-act="reader-style" aria-label="表示設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19L9 5l5 14M5.8 14h6.4M15 19l3-8 3 8M15.9 16.6h4.2"/></svg></button>
    </div>
    <div id="page" tabindex="0"></div>
    <div class="selbar" id="selbar" hidden>
      <button data-act="sel-lookup">✦ 意味</button>
      <button data-act="sel-tr">訳す</button>
      <button data-act="sel-save">保存</button>
    </div>
    <div class="r-bottom">
      <div class="bar"><i id="r-bar" style="width:0%"></i></div>
      <div class="row">
        <span id="r-pct" style="font-variant-numeric: tabular-nums">0%</span>
        <span class="spacer"></span>
        <button class="btn small" data-act="toc">目次</button>
        <button class="btn small" data-act="tr-toggle" id="r-trbtn" aria-pressed="true">訳</button>
        <button class="btn small" data-act="tr-chapter">✦ 章を訳す</button>
        <button class="btn small" data-act="summary">✦ あらすじ</button>
        <button class="btn small" data-act="finish" id="r-finish" hidden>読了</button>
      </div>
      <div class="r-note" style="margin:0 !important;text-align:left">「訳」がオンのとき段落をタップすると日本語訳が出ます。文を選ぶと「意味」「訳す」「保存」。中央付近の余白をタップで表示切替。</div>
    </div>
  </section>

  <div id="sheet-wrap" hidden>
    <div id="sheet" role="dialog" aria-modal="true">
      <div class="sh-head"><h3 id="sh-title"></h3><button class="icon-btn" data-act="close-sheet" aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="sh-body" id="sh-body"></div>
    </div>
  </div>

  <div id="toast" hidden></div>
</div>

<script src="app.js"></script>
</body>
</html>
